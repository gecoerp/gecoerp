<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicio no disponible</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #e8f0fb 0%, #fdf6e3 100%);
  }
  .card {
    background: #fff; border-radius: 16px; padding: 48px 40px;
    max-width: 420px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.08);
  }
  .dot {
    width: 72px; height: 72px; margin: 0 auto 24px;
    border-radius: 50%;
    background: conic-gradient(#3b82f6 0turn, #8b5cf6 .33turn, #f59e0b .66turn, #3b82f6 1turn);
  }
  h1 { font-size: 22px; margin: 0 0 12px; color: #1a1a2e; }
  p { color: #666; line-height: 1.5; margin: 0 0 24px; }
  button {
    background: linear-gradient(90deg, #2563eb, #3b82f6);
    color: #fff; border: none; border-radius: 8px;
    padding: 12px 28px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: .92; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>Servicio no disponible</h1>
    <p>El sitio está temporalmente fuera de línea. Ya lo sabemos y estamos trabajando para restablecerlo. Intenta de nuevo en unos minutos.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>

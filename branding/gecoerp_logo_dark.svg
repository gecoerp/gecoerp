<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="60%" stop-color="#060913" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>
    <linearGradient id="topRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052ff" />
      <stop offset="50%" stop-color="#7952ff" />
      <stop offset="100%" stop-color="#ffb000" />
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle / Square -->
  <rect width="1000" height="1000" fill="url(#bgGrad)" />

  <g transform="translate(500, 500)">
    <!-- Soft Glow Backdrop -->
    <circle cx="-150" cy="0" r="280" fill="#0052ff" opacity="0.12" filter="url(#neonGlow)" />
    <circle cx="150" cy="150" r="250" fill="#ffb000" opacity="0.10" filter="url(#neonGlow)" />

    <!-- Left Half: Blue Segment (180 deg) -->
    <path d="M -8,-420 A 420 420 0 0 0 -8,420 L -8,255 A 255 255 0 0 1 -8,-255 Z" fill="#0052ff" />

    <!-- Top-Right Quadrant: Gradient Segment (90 deg) -->
    <path d="M 8,-420 A 420 420 0 0 1 420,-8 L 255,-8 A 255 255 0 0 0 8,-255 Z" fill="url(#topRightGrad)" />

    <!-- Bottom-Right Quadrant: Amber/Gold Segment (90 deg) -->
    <path d="M 420,8 A 420 420 0 0 1 8,420 L 8,255 A 255 255 0 0 0 255,8 Z" fill="#ffb000" />
  </g>
</svg>

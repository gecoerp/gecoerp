<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="topRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052ff" />
      <stop offset="50%" stop-color="#7952ff" />
      <stop offset="100%" stop-color="#ffb000" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#subtleGlow)" transform="translate(500, 500)">
    <!-- Left Half: Blue Segment (180 deg) -->
    <!-- Arc from 270 deg (top) to 90 deg (bottom) on left side -->
    <path d="M 0,-420 A 420 420 0 0 0 0,420 L 0,260 A 260 260 0 0 1 0,-260 Z" fill="#0052ff" />

    <!-- Top-Right Quadrant: Gradient Segment (90 deg) -->
    <!-- Arc from 270 deg (top) to 0 deg (right) with a 6px gap -->
    <path d="M 12,-420 A 420 420 0 0 1 420,-12 L 260,-8 A 260 260 0 0 0 8,-260 Z" fill="url(#topRightGrad)" />

    <!-- Bottom-Right Quadrant: Amber/Gold Segment (90 deg) -->
    <!-- Arc from 0 deg (right) to 90 deg (bottom) with a 6px gap -->
    <path d="M 420,12 A 420 420 0 0 1 12,420 L 8,260 A 260 260 0 0 0 260,8 Z" fill="#ffb000" />
  </g>
</svg>
